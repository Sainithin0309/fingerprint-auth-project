<!DOCTYPE html>
<html>
<head>
    <title>Fingerprint Validation & ZKP Generation</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(120deg, #020003, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: rgba(0, 213, 60, 0.1);
            backdrop-filter: blur(10px);
            padding: 2.5rem 3rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 { color: white; font-size: 1.8rem; margin-bottom: 2rem; }
        h2 { color: #2ecc71; font-size: 1.4rem; margin-top: 2rem; }
        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            color: #333;
            box-sizing: border-box;
        }
        input:focus { outline: none; background: white; }
        .spo2-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .spo2-row label {
            white-space: nowrap;
            font-size: 14px;
            color: #aaffaa;
            min-width: 140px;
            text-align: left;
        }
        .spo2-row input { margin: 0; flex: 1; }
        .spo2-hint {
            font-size: 12px;
            color: #88cc88;
            margin: -6px 0 10px 0;
            text-align: left;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background: #2ecc71;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        button:hover { background: #27ae60; transform: translateY(-2px); }
        #statusMessage {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            min-height: 20px;
        }
        #otpDisplay {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
            margin: 15px 0;
            padding: 15px;
            background: rgba(46, 204, 113, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fingerprint Validation & ZKP Generation</h1>

        <input type="text" id="user_id" placeholder="Enter User ID" required>

        <!-- SpO2 liveness value — simulates MAX30102 sensor reading -->
        <div class="spo2-row">
            <label>SpO₂ Liveness (%):</label>
            <input type="number" id="spo2_value" placeholder="97" min="85" max="100" value="97">
        </div>
        <p class="spo2-hint">Simulates liveness sensor (MAX30102). Valid range: 85–100.</p>

        <button onclick="validateFingerprint()">Validate Fingerprint</button>

        <div id="statusMessage"></div>
        <h2>OTP for Browser Plugin:</h2>
        <p id="otpDisplay"></p>
        <div id="timer" style="font-size:16px; color:#ff5555; margin-top:10px;"></div>
    </div>

    <script>
        let otpTimer = null;
        let otpTimeout = null;

        async function validateFingerprint() {
            const userId = document.getElementById("user_id").value.trim();
            const spo2Value = parseInt(document.getElementById("spo2_value").value) || 97;

            if (!userId) { alert("Please enter a User ID"); return; }

            if (spo2Value < 85 || spo2Value > 100) {
                alert("SpO₂ must be between 85 and 100 (liveness check).");
                return;
            }

            // WebAuthn — credential ID comes from the fingerprint reader
            const publicKeyOptions = {
                challenge: new Uint8Array(32),
                rp: {
                    name: "Fingerprint Authentication",
                    id: "fingerprint-auth-using-zkp.onrender.com"
                },
                userVerification: "required"
            };

            try {
                document.getElementById("statusMessage").innerText = "⏳ Reading fingerprint...";

                const assertion = await navigator.credentials.get({ publicKey: publicKeyOptions });

                if (!assertion) {
                    document.getElementById("statusMessage").innerText = "Fingerprint validation failed.";
                    return;
                }

                const credentialId = btoa(String.fromCharCode(...new Uint8Array(assertion.rawId)));

                document.getElementById("statusMessage").innerText = "⏳ Generating ZKP proof...";

                const response = await fetch('https://fingerprint-auth-using-zkp.onrender.com/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        credential_id: credentialId,
                        spo2_value: spo2Value
                    })
                });

                const result = await response.json();

                if (result.status === "success") {
                    document.getElementById("statusMessage").innerText = "✅ Fingerprint validated! ZKP generated.";
                    document.getElementById("otpDisplay").innerText = `Your OTP: ${result.otp}`;
                    startOtpTimer();
                } else {
                    document.getElementById("statusMessage").innerText = `Validation failed: ${result.message}`;
                    clearOtpDisplay();
                }
            } catch (error) {
                document.getElementById("statusMessage").innerText = "Fingerprint error: " + error.message;
            }
        }

        function startOtpTimer() {
            let timeLeft = 300; // 5 minutes — matches PostgreSQL OTP TTL
            document.getElementById("timer").innerText = `OTP expires in ${timeLeft}s`;
            clearTimeout(otpTimeout);
            clearInterval(otpTimer);
            otpTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    document.getElementById("timer").innerText = `OTP expires in ${timeLeft}s`;
                } else {
                    clearInterval(otpTimer);
                    clearOtpDisplay();
                }
            }, 1000);
            otpTimeout = setTimeout(clearOtpDisplay, 300000);
        }

        function clearOtpDisplay() {
            document.getElementById("otpDisplay").innerText = "";
            document.getElementById("timer").innerText = "OTP expired.";
        }

        function pluginClearOtp() { clearOtpDisplay(); }
    </script>
</body>
</html>
